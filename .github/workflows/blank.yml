name: Breakout Contribution Game

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  breakout:
    runs-on: ubuntu-latest

    steps:
      - name: Generate animated Breakout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: wlzbi-exe
        run: |
          mkdir -p dist

          node <<'NODE'
          const fs = require("fs");
          const https = require("https");

          const USERNAME = process.env.USERNAME;
          const TOKEN = process.env.GH_TOKEN;

          const QUERY = `
            query($login:String!) {
              user(login:$login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        weekday
                        date
                      }
                    }
                  }
                }
              }
            }
          `;

          function github() {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                query: QUERY,
                variables: {
                  login: USERNAME
                }
              });

              const request = https.request({
                hostname: "api.github.com",
                path: "/graphql",
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${TOKEN}`,
                  "Content-Type": "application/json",
                  "User-Agent": "wlzbi-breakout",
                  "Content-Length": Buffer.byteLength(body)
                }
              }, response => {

                let data = "";

                response.on(
                  "data",
                  chunk => data += chunk
                );

                response.on(
                  "end",
                  () => {

                    try {

                      const json =
                        JSON.parse(data);

                      if (json.errors) {
                        reject(
                          new Error(
                            JSON.stringify(json.errors)
                          )
                        );

                        return;
                      }

                      resolve(json);

                    } catch (error) {
                      reject(error);
                    }

                  }
                );
              });

              request.on(
                "error",
                reject
              );

              request.write(body);
              request.end();
            });
          }

          function esc(value) {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;");
          }

          function generate(calendar, dark) {

            const CELL = 12;
            const GAP = 3;
            const STEP = CELL + GAP;

            const weeks =
              calendar.weeks;

            const cols =
              weeks.length;

            const rows = 7;

            const WIDTH =
              cols * STEP + 80;

            const HEIGHT =
              rows * STEP + 120;

            const OX = 40;
            const OY = 50;

            const palette = dark
              ? [
                  "#161b22",
                  "#0e4429",
                  "#006d32",
                  "#26a641",
                  "#39d353"
                ]
              : [
                  "#ebedf0",
                  "#9be9a8",
                  "#40c463",
                  "#30a14e",
                  "#216e39"
                ];

            let maximum = 1;

            for (const week of weeks) {

              for (
                const day
                of week.contributionDays
              ) {

                maximum =
                  Math.max(
                    maximum,
                    day.contributionCount
                  );
              }
            }

            /*
             * BACKGROUND CONTRIBUTION GRID
             */

            let bricks = "";

            const brickData = [];

            for (
              let x = 0;
              x < cols;
              x++
            ) {

              for (
                let y = 0;
                y < rows;
                y++
              ) {

                const day =
                  weeks[x]
                    .contributionDays
                    .find(
                      d =>
                        d.weekday === y
                    );

                const count =
                  day
                    ? day.contributionCount
                    : 0;

                let level = 0;

                if (count > 0)
                  level = 1;

                if (
                  count >=
                  maximum * .25
                )
                  level = 2;

                if (
                  count >=
                  maximum * .50
                )
                  level = 3;

                if (
                  count >=
                  maximum * .75
                )
                  level = 4;

                const px =
                  OX + x * STEP;

                const py =
                  OY + y * STEP;

                const id =
                  `brick-${x}-${y}`;

                brickData.push({
                  id,
                  x: px,
                  y: py,
                  level,
                  count
                });

                /*
                 * Brick glow.
                 */

                bricks += `
                  <g id="${id}">

                    <rect
                      x="${px}"
                      y="${py}"
                      width="${CELL}"
                      height="${CELL}"
                      rx="3"
                      fill="${palette[level]}"
                    />

                    <rect
                      x="${px + 1}"
                      y="${py + 1}"
                      width="${CELL - 2}"
                      height="2"
                      rx="1"
                      fill="#ffffff"
                      opacity=".10"
                    />

                  </g>
                `;
              }
            }

            /*
             * GAME AREA
             */

            const gameLeft = OX;

            const gameRight =
              OX + cols * STEP;

            const gameTop =
              OY;

            const gameBottom =
              OY + rows * STEP;

            /*
             * BALL PATH
             *
             * Several collision-looking segments
             * make the animation feel like an actual
             * breakout run.
             */

            const ballX =
              gameLeft +
              (gameRight - gameLeft) * .57;

            const ballY =
              gameTop +
              (gameBottom - gameTop) * .42;

            const ballPath = `
              M ${ballX} ${ballY}

              L ${gameRight - 15} ${gameTop + 12}

              L ${gameRight - 30} ${gameBottom - 12}

              L ${gameLeft + 120} ${gameTop + 22}

              L ${gameLeft + 15} ${gameBottom - 16}

              L ${gameRight - 75} ${gameTop + 12}

              L ${gameRight - 10} ${gameBottom - 25}

              L ${gameLeft + 50} ${gameTop + 15}

              L ${gameLeft + 15} ${gameBottom - 12}

              L ${gameRight - 15} ${gameTop + 20}

              L ${gameRight - 70} ${gameBottom - 10}

              L ${gameLeft + 90} ${gameTop + 10}

              L ${gameLeft + 20} ${gameBottom - 15}

              L ${gameRight - 20} ${gameTop + 15}

              L ${gameRight - 40} ${gameBottom - 10}

              L ${gameLeft + 50} ${gameTop + 15}

              L ${gameLeft + 15} ${gameBottom - 15}

              L ${gameRight - 15} ${gameTop + 20}

              L ${gameRight - 60} ${gameBottom - 15}

              L ${gameLeft + 110} ${gameTop + 15}

              L ${gameLeft + 25} ${gameBottom - 20}

              L ${gameRight - 20} ${gameTop + 20}
            `;

            /*
             * Generate random-looking brick impact pulses.
             */

            let impacts = "";

            brickData
              .filter(b => b.level > 0)
              .forEach((brick, i) => {

                const delay =
                  (i * 0.19) % 16;

                const cx =
                  brick.x + CELL / 2;

                const cy =
                  brick.y + CELL / 2;

                impacts += `
                  <g>

                    <circle
                      cx="${cx}"
                      cy="${cy}"
                      r="2"
                      fill="${
                        dark
                          ? "#ffffff"
                          : "#216e39"
                      }"
                      opacity="0"
                    >

                      <animate
                        attributeName="r"
                        values="2;10;2"
                        begin="${delay}s"
                        dur=".55s"
                        repeatCount="indefinite"
                      />

                      <animate
                        attributeName="opacity"
                        values="0;.8;0"
                        begin="${delay}s"
                        dur=".55s"
                        repeatCount="indefinite"
                      />

                    </circle>

                  </g>
                `;
              });

            /*
             * PARTICLES.
             */

            let particles = "";

            for (
              let i = 0;
              i < 22;
              i++
            ) {

              const bx =
                gameLeft +
                30 +
                (
                  i * 83
                ) %
                Math.max(
                  100,
                  gameRight - gameLeft - 60
                );

              const by =
                gameTop +
                15 +
                (
                  i * 47
                ) %
                Math.max(
                  50,
                  gameBottom - gameTop - 30
                );

              particles += `
                <circle
                  cx="${bx}"
                  cy="${by}"
                  r="${1 + (i % 2)}"
                  fill="${
                    dark
                      ? "#39d353"
                      : "#216e39"
                  }"
                  opacity="0"
                >

                  <animate
                    attributeName="cy"
                    values="${by};${by - 12};${by}"
                    dur="${
                      1.5 +
                      (i % 4) * .4
                    }s"
                    begin="${
                      (i * .31) % 4
                    }s"
                    repeatCount="indefinite"
                  />

                  <animate
                    attributeName="opacity"
                    values="0;.55;0"
                    dur="${
                      1.5 +
                      (i % 4) * .4
                    }s"
                    begin="${
                      (i * .31) % 4
                    }s"
                    repeatCount="indefinite"
                  />

                </circle>
              `;
            }

            /*
             * PADDLE
             *
             * It follows the ball horizontally.
             */

            const paddleY =
              gameBottom + 18;

            const paddleWidth = 58;

            const paddleX =
              (gameLeft + gameRight) / 2 -
              paddleWidth / 2;

            const paddleAnimation = `
              <rect
                x="${paddleX}"
                y="${paddleY}"
                width="${paddleWidth}"
                height="7"
                rx="3.5"
                fill="${
                  dark
                    ? "#f0f6fc"
                    : "#24292f"
                }"
              >

                <animate
                  attributeName="x"
                  values="
                    ${paddleX};
                    ${gameRight - paddleWidth};
                    ${gameLeft};
                    ${paddleX}
                  "
                  dur="7s"
                  repeatCount="indefinite"
                />

              </rect>
            `;

            /*
             * BALL
             */

            const ball = `
              <g>

                <!-- glow -->

                <circle
                  r="10"
                  fill="${
                    dark
                      ? "#39d353"
                      : "#216e39"
                  }"
                  opacity=".14"
                  filter="url(#blur)"
                >

                  <animateMotion
                    dur="7s"
                    repeatCount="indefinite"
                  >
                    <mpath
                      href="#ballPath"
                    />
                  </animateMotion>

                </circle>

                <!-- trail -->

                <circle
                  r="5"
                  fill="${
                    dark
                      ? "#ffffff"
                      : "#24292f"
                  }"
                >

                  <animateMotion
                    dur="7s"
                    repeatCount="indefinite"
                  >
                    <mpath
                      href="#ballPath"
                    />
                  </animateMotion>

                </circle>

                <!-- inner core -->

                <circle
                  r="2"
                  fill="${
                    dark
                      ? "#39d353"
                      : "#216e39"
                  }"
                >

                  <animateMotion
                    dur="7s"
                    repeatCount="indefinite"
                  >
                    <mpath
                      href="#ballPath"
                    />
                  </animateMotion>

                </circle>

              </g>
            `;

            /*
             * SCORE.
             */

            const score = `
              <text
                x="${gameLeft}"
                y="23"
                font-family="monospace"
                font-size="11"
                font-weight="700"
                fill="${
                  dark
                    ? "#8b949e"
                    : "#57606a"
                }"
              >
                SCORE
              </text>

              <text
                x="${gameLeft + 43}"
                y="23"
                font-family="monospace"
                font-size="11"
                font-weight="700"
                fill="${
                  dark
                    ? "#39d353"
                    : "#216e39"
                }"
              >
                <tspan>000</tspan>

                <animate
                  attributeName="opacity"
                  values="1;.4;1"
                  dur="1.2s"
                  repeatCount="indefinite"
                />
              </text>
            `;

            /*
             * LIVES.
             */

            const lives = `
              <text
                x="${gameRight - 100}"
                y="23"
                font-family="monospace"
                font-size="11"
                font-weight="700"
                fill="${
                  dark
                    ? "#8b949e"
                    : "#57606a"
                }"
              >
                LIVES
              </text>

              <text
                x="${gameRight - 55}"
                y="23"
                font-size="10"
              >
                ♥ ♥ ♥
              </text>
            `;

            /*
             * FLASHING IMPACT BORDER.
             */

            const border = `
              <rect
                x="${gameLeft - 5}"
                y="${gameTop - 5}"
                width="${
                  gameRight -
                  gameLeft +
                  10
                }"
                height="${
                  gameBottom -
                  gameTop +
                  10
                }"
                rx="7"
                fill="none"
                stroke="${
                  dark
                    ? "#39d353"
                    : "#216e39"
                }"
                stroke-width="1"
                opacity=".12"
              >

                <animate
                  attributeName="opacity"
                  values=".04;.30;.04"
                  dur="3s"
                  repeatCount="indefinite"
                />

              </rect>
            `;

            return `<?xml version="1.0" encoding="UTF-8"?>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${WIDTH}"
            height="${HEIGHT}"
            viewBox="0 0 ${WIDTH} ${HEIGHT}"
            role="img"
            aria-label="Animated Breakout contribution graph for ${esc(USERNAME)}"
          >

            <defs>

              <path
                id="ballPath"
                d="${ballPath}"
              />

              <filter
                id="blur"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >

                <feGaussianBlur
                  stdDeviation="3"
                />

              </filter>

            </defs>

            <!-- background -->

            <rect
              width="100%"
              height="100%"
              rx="12"
              fill="${
                dark
                  ? "#0d1117"
                  : "#ffffff"
              }"
            />

            ${score}

            ${lives}

            <!-- contribution bricks -->

            <g>
              ${bricks}
            </g>

            <!-- hit effects -->

            <g>
              ${impacts}
            </g>

            <!-- particles -->

            <g>
              ${particles}
            </g>

            ${border}

            <!-- paddle -->

            <g>
              ${paddleAnimation}
            </g>

            <!-- ball -->

            ${ball}

            <!-- bottom status -->

            <text
              x="${WIDTH / 2}"
              y="${HEIGHT - 13}"
              text-anchor="middle"
              font-family="monospace"
              font-size="9"
              fill="${
                dark
                  ? "#484f58"
                  : "#8c959f"
              }"
            >
              CONTRIBUTION BREAKOUT · ${esc(USERNAME)}
            </text>

          </svg>`;
          }

          (async () => {

            console.log(
              `🎮 Generating Breakout for @${USERNAME}`
            );

            const result =
              await github();

            const calendar =
              result.data.user
                .contributionsCollection
                .contributionCalendar;

            fs.writeFileSync(
              "dist/breakout.svg",
              generate(
                calendar,
                false
              )
            );

            fs.writeFileSync(
              "dist/breakout-dark.svg",
              generate(
                calendar,
                true
              )
            );

            console.log(
              "✅ breakout.svg generated"
            );

            console.log(
              "✅ breakout-dark.svg generated"
            );

          })().catch(error => {

            console.error(
              "❌ Generation failed"
            );

            console.error(error);

            process.exit(1);
          });

          NODE

      - name: Publish game
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
