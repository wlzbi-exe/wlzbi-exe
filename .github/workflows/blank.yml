name: Generate Snake Contribution Graph

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - name: Generate animated Snake SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: wlzbi-exe
        run: |
          mkdir -p dist

          node <<'NODE'
          const fs = require("fs");
          const https = require("https");

          const username = process.env.USERNAME;
          const token = process.env.GH_TOKEN;

          const query = `
            query($login:String!) {
              user(login:$login) {
                contributionsCollection {
                  contributionCalendar {
                    weeks {
                      contributionDays {
                        contributionCount
                        weekday
                        date
                      }
                    }
                  }
                }
              }
            }
          `;

          function graphql() {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                query,
                variables: { login: username }
              });

              const req = https.request({
                hostname: "api.github.com",
                path: "/graphql",
                method: "POST",
                headers: {
                  "User-Agent": "snake-contribution-graph",
                  "Authorization": `Bearer ${token}`,
                  "Content-Type": "application/json",
                  "Content-Length": Buffer.byteLength(body)
                }
              }, res => {
                let data = "";

                res.on("data", chunk => data += chunk);

                res.on("end", () => {
                  try {
                    resolve(JSON.parse(data));
                  } catch (e) {
                    reject(e);
                  }
                });
              });

              req.on("error", reject);
              req.write(body);
              req.end();
            });
          }

          function esc(v) {
            return String(v)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;");
          }

          function generate(calendar, dark) {
            const weeks = calendar.weeks;

            const cell = 11;
            const gap = 4;
            const step = cell + gap;

            const cols = weeks.length;
            const rows = 7;

            const width = cols * step + 60;
            const height = rows * step + 70;

            const ox = 30;
            const oy = 35;

            const colors = dark
              ? [
                  "#161b22",
                  "#0e4429",
                  "#006d32",
                  "#26a641",
                  "#39d353"
                ]
              : [
                  "#ebedf0",
                  "#9be9a8",
                  "#40c463",
                  "#30a14e",
                  "#216e39"
                ];

            const cells = [];

            for (let x = 0; x < cols; x++) {
              for (let y = 0; y < rows; y++) {

                const day =
                  weeks[x].contributionDays.find(
                    d => d.weekday === y
                  );

                const count = day ? day.contributionCount : 0;

                let level = 0;

                if (count > 0) level = 1;
                if (count >= 3) level = 2;
                if (count >= 6) level = 3;
                if (count >= 10) level = 4;

                cells.push(`
                  <rect
                    x="${ox + x * step}"
                    y="${oy + y * step}"
                    width="${cell}"
                    height="${cell}"
                    rx="2.5"
                    fill="${colors[level]}"
                  >
                    <animate
                      attributeName="opacity"
                      values="0.82;1;0.82"
                      dur="${2 + ((x + y) % 5) * .3}s"
                      repeatCount="indefinite"
                    />
                  </rect>
                `);
              }
            }

            /*
             * Build a long serpentine route through the calendar.
             */
            const route = [];

            for (let x = 0; x < cols; x++) {
              const ys =
                x % 2 === 0
                  ? [...Array(rows).keys()]
                  : [...Array(rows).keys()].reverse();

              for (const y of ys) {
                route.push({
                  x: ox + x * step + cell / 2,
                  y: oy + y * step + cell / 2
                });
              }
            }

            const points = route
              .map(p => `${p.x},${p.y}`)
              .join(" ");

            const path =
              route.length
                ? `M ${route.map(
                    p => `${p.x} ${p.y}`
                  ).join(" L ")}`
                : "M 0 0";

            /*
             * Multiple animated body segments.
             */
            let body = "";

            const segments = 12;

            for (let i = 0; i < segments; i++) {
              const delay = -(i * 0.16);

              body += `
                <circle
                  r="${5.8 - i * 0.22}"
                  fill="${dark ? "#39d353" : "#216e39"}"
                  opacity="${1 - i * 0.055}"
                >
                  <animateMotion
                    dur="28s"
                    begin="${delay}s"
                    repeatCount="indefinite"
                    rotate="auto"
                    path="${esc(path)}"
                  />
                </circle>
              `;
            }

            /*
             * Snake head.
             */
            const head = `
              <g>

                <circle
                  r="7"
                  fill="${dark ? "#58ff78" : "#238636"}"
                >
                  <animateMotion
                    dur="28s"
                    repeatCount="indefinite"
                    rotate="auto"
                    path="${esc(path)}"
                  />
                </circle>

                <!-- eyes -->

                <circle
                  cx="-2.2"
                  cy="-2.5"
                  r="1.25"
                  fill="${dark ? "#ffffff" : "#ffffff"}"
                >
                  <animateMotion
                    dur="28s"
                    repeatCount="indefinite"
                    rotate="auto"
                    path="${esc(path)}"
                  />
                </circle>

                <circle
                  cx="2.2"
                  cy="-2.5"
                  r="1.25"
                  fill="${dark ? "#ffffff" : "#ffffff"}"
                >
                  <animateMotion
                    dur="28s"
                    repeatCount="indefinite"
                    rotate="auto"
                    path="${esc(path)}"
                  />
                </circle>

              </g>
            `;

            /*
             * Food markers.
             */
            const foodPositions = route.filter(
              (_, i) => i % 23 === 7
            );

            let food = "";

            foodPositions.forEach((p, i) => {
              food += `
                <circle
                  cx="${p.x}"
                  cy="${p.y}"
                  r="3.5"
                  fill="${dark ? "#ff6b6b" : "#cf222e"}"
                >
                  <animate
                    attributeName="r"
                    values="3;4.5;3"
                    dur="1s"
                    repeatCount="indefinite"
                  />

                  <animate
                    attributeName="opacity"
                    values="1;.35;1"
                    dur="1s"
                    repeatCount="indefinite"
                  />
                </circle>
              `;
            });

            return `<?xml version="1.0" encoding="UTF-8"?>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${width}"
            height="${height}"
            viewBox="0 0 ${width} ${height}"
            role="img"
            aria-label="Snake contribution graph for ${esc(username)}"
          >

            <defs>

              <filter
                id="glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >
                <feGaussianBlur
                  stdDeviation="3"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <linearGradient
                id="snakeGradient"
                x1="0"
                x2="1"
              >
                <stop
                  offset="0%"
                  stop-color="${dark ? "#0e4429" : "#9be9a8"}"
                />

                <stop
                  offset="100%"
                  stop-color="${dark ? "#39d353" : "#216e39"}"
                />
              </linearGradient>

            </defs>

            <rect
              width="100%"
              height="100%"
              rx="12"
              fill="${dark ? "#0d1117" : "#ffffff"}"
            />

            <g>
              ${cells.join("")}
            </g>

            <!-- Food -->

            <g>
              ${food}
            </g>

            <!-- Snake shadow -->

            <polyline
              points="${points}"
              fill="none"
              stroke="${dark ? "#39d353" : "#216e39"}"
              stroke-width="12"
              stroke-linecap="round"
              stroke-linejoin="round"
              opacity=".10"
              stroke-dasharray="1 34"
            >
              <animate
                attributeName="stroke-dashoffset"
                from="0"
                to="-2500"
                dur="28s"
                repeatCount="indefinite"
              />
            </polyline>

            <!-- Snake -->

            <g
              filter="url(#glow)"
              stroke-linecap="round"
            >
              ${body}
              ${head}
            </g>

            <!-- subtle scan animation -->

            <rect
              x="${ox}"
              y="${oy}"
              width="${cols * step}"
              height="${rows * step}"
              fill="none"
              stroke="${dark ? "#39d353" : "#216e39"}"
              stroke-width="1"
              opacity=".08"
            >
              <animate
                attributeName="opacity"
                values=".02;.12;.02"
                dur="4s"
                repeatCount="indefinite"
              />
            </rect>

          </svg>`;
          }

          (async () => {

            const result = await graphql();

            if (
              !result.data ||
              !result.data.user ||
              !result.data.user.contributionsCollection
            ) {
              throw new Error(
                "Could not retrieve GitHub contribution data."
              );
            }

            const calendar =
              result.data.user
                .contributionsCollection
                .contributionCalendar;

            fs.writeFileSync(
              "dist/snake.svg",
              generate(calendar, false)
            );

            fs.writeFileSync(
              "dist/snake-dark.svg",
              generate(calendar, true)
            );

            console.log("🐍 Snake SVGs generated successfully.");

          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
